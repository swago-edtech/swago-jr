# /etc/nginx/sites-available/swagojr
#
# swagojr.com       → Next.js web app  (port 3000)
# admin.swagojr.com → Next.js admin app (port 3001)
#
# Prerequisites:
#   sudo certbot --nginx -d swagojr.com -d www.swagojr.com -d admin.swagojr.com

# ── Rate limiting zones ────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# ── Upstream definitions ───────────────────────────────────────────────────
upstream web_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream admin_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name swagojr.com www.swagojr.com admin.swagojr.com;
    return 301 https://$host$request_uri;
}

# ── www → non-www ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.swagojr.com;

    ssl_certificate     /etc/letsencrypt/live/swagojr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swagojr.com/privkey.pem;

    return 301 https://swagojr.com$request_uri;
}

# ── Main web app: swagojr.com ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name swagojr.com;

    ssl_certificate     /etc/letsencrypt/live/swagojr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swagojr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://web_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API routes — rate limited
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Everything else
    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Admin app: admin.swagojr.com ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.swagojr.com;

    ssl_certificate     /etc/letsencrypt/live/swagojr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swagojr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional: restrict admin to specific IPs
    # allow 1.2.3.4;
    # deny all;

    client_max_body_size 50M;

    location /_next/static/ {
        proxy_pass http://admin_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_cache_bypass $http_upgrade;
    }
}
