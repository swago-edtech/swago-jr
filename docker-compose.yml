# =============================================================================
# Swago Jr. — Docker Compose
#
# Usage:
#   docker compose up -d              # Start both services
#   docker compose up -d web          # Start web only
#   docker compose up -d admin        # Start admin only
#   docker compose build              # Build both images
#   docker compose logs -f            # Follow logs
#
# Prerequisites:
#   - Copy .env.example to .env and fill in values
#   - DOCKER_BUILDKIT=1 (usually default in modern Docker)
# =============================================================================

services:
  # ── Web App (swagojr.com) ──────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
    image: swago-web:latest
    container_name: swago-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - swago-network

  # ── Admin App (admin.swagojr.com) ──────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-admin
    image: swago-admin:latest
    container_name: swago-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - swago-network

networks:
  swago-network:
    driver: bridge
